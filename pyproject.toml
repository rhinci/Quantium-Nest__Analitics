[project]
name = "generator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rhinci", email = "dashalupanova@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "clickhouse-connect>=1.11.0",
    "pydantic-settings>=2.16.0",
]

[project.scripts]
generator = "generator:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
